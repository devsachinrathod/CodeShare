services:
  db:
    image: postgres:16-alpine
    container_name: codeshare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codeshare
    ports:
      - "5432:5432"
    volumes:
      - codeshare_pgdata:/var/lib/postgresql/data

volumes:
  codeshare_pgdata:
